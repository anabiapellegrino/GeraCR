name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest
      - name: roda os quatro cenarios pelo terminal
        shell: bash
        run: |
          python -m geracr cenarios/01-loja-pytest/relatorio.xml --config cenarios/01-loja-pytest/config.json --saida saida/01
          python -m geracr cenarios/02-banco-jest/relatorio.xml --config cenarios/02-banco-jest/config.json --saida saida/02
          python -m geracr cenarios/03-biblioteca-robot/relatorio.xml --config cenarios/03-biblioteca-robot/config.json --saida saida/03
          python -m geracr cenarios/04-clinica-unittest-json/relatorio.json --config cenarios/04-clinica-unittest-json/config.json --saida saida/04
        env:
          PYTHONIOENCODING: utf-8
